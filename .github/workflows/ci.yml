name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (OpenBB ${{ matrix.openbb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both OpenBB release lines are supported from the same codebase.
        openbb: ["4", "5"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras for OpenBB ${{ matrix.openbb }}
        run: pip install -e ".[dev,openbb${{ matrix.openbb }}]"

      - name: Show resolved OpenBB versions
        run: pip list | grep -iE '^(openbb|openbb-core|openbb-platform-api|openbb-mcp-server|fastapi) '

      - name: Unit tests (no TWS/network required)
        run: PYTHONPATH=src python -m pytest -q

      - name: Offline wiring smoke test
        run: PYTHONPATH=src python scripts/smoke_test.py

  dependency-audit:
    name: dependency-audit (OpenBB ${{ matrix.openbb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openbb: ["4", "5"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras for OpenBB ${{ matrix.openbb }}
        run: pip install -e ".[dev,openbb${{ matrix.openbb }}]"

      - name: Scan dependencies for known CVEs (pip-audit)
        # Non-blocking for now: several current findings live in OpenBB's own
        # transitive dependency tree, upstream of this project. Surfaced here
        # so risk stays visible; flip to blocking once triaged.
        continue-on-error: true
        run: pip-audit --progress-spinner off
