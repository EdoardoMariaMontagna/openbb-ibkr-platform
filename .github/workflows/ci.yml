name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Unit tests (no TWS/network required)
        run: PYTHONPATH=src python -m pytest -q

      - name: Offline wiring smoke test
        run: PYTHONPATH=src python scripts/smoke_test.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Scan dependencies for known CVEs (pip-audit)
        # Non-blocking for now: several current findings live in OpenBB's own
        # transitive dependency tree, upstream of this project. Surfaced here
        # so risk stays visible; flip to blocking once triaged.
        continue-on-error: true
        run: pip-audit --progress-spinner off
